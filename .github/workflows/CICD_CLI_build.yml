name: Build CLI Binaries

on:
  push:
    # tags: // TODO enable on release
    #   - 'v*'
    paths:
      - 'apps/cli/**'
  workflow_dispatch:

jobs:
  build:
    name: Build executable for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install PNPM
        run: npm install -g pnpm

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      # - name: Build CLI
      #   working-directory: apps/cli
      #   run: |
      #     if [ "${{ matrix.os }}" == "windows-latest" ]; then
      #       bun build --compile --outfile=release/doci-cli-win.exe src/index.ts
      #     elif [ "${{ matrix.os }}" == "macos-latest" ]; then
      #       bun build --compile --outfile=release/doci-cli-macos src/index.ts
      #     else
      #       bun build --compile --outfile=release/doci-cli-linux src/index.ts
      #     fi

      - name: Build CLI (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: apps/cli
        run: bun build --compile --outfile=release/doci-cli-win.exe src/index.ts
        shell: powershell

      - name: Build CLI (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: apps/cli
        run: bun build --compile --outfile=release/doci-cli-macos src/index.ts

      - name: Build CLI (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: apps/cli
        run: bun build --compile --outfile=release/doci-cli-linux src/index.ts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doci-cli-${{ matrix.os }}
          path: apps/cli/release/*
